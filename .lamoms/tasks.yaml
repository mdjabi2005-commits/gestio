_principe: 'Principe de l''arbre (posé par l''utilisateur, 2026-07-31).

  La racine est la Core Feature : savoir son solde disponible à tout moment.

  Tout ce qu''on ajoute doit pousser à partir d''elle et la servir.

  On n''ajoute jamais pour ajouter : si un ajout n''apporte pas de valeur réelle

  à la racine, il n''entre pas. Ce qui manque se rajoutera quand le besoin sera

  démontré, pas par anticipation.

  '
_sources_a_lire: "Le lab AGY n'est PAS dans git (données bancaires réelles + session vivante),\nmais tout\
  \ est local : on y va par chemin absolu, depuis le maître comme\ndepuis un worktree.\n  /mnt/c/Users/djabi/gestio/.lamoms/lab/agy/rapport_architecture_gestio.md\n\
  Sa section Q4 dit, banque par banque et relevé à la source, quels champs de\ntransaction sont réellement\
  \ fournis et jusqu'où remonte l'historique\n(La Banque Postale 90 j, Trade Republic 90 j, Revolut 3727\
  \ j).\nÀ lire avant de coder T2 et T4. Ne rien recopier de ce dossier dans le dépôt.\n  /mnt/c/Users/djabi/gestio/.lamoms/lab/agy/rapport_agy_recherche.md\n\
  Le rapport de mesure du 2026-08-01 — fenêtre d'historique, pagination, clé de\ncontinuation, régimes\
  \ de quota. Chaque réponse y est marquée sourcée, mesurée\nou non trouvée, et pointe le script qui l'a\
  \ produite (mesure_phase2_*.py,\nmesure_phase3_sca.py) plus les journaux d'appels. À lire avant de coder\
  \ T4.\n"
_ordre_conseille: 'Chemin le plus court vers une application utilisable : T1 → T4 → T7.

  À ce stade l''app affiche le vrai solde, synchronisé automatiquement.

  T3 sécurise. T5 et T6 apportent l''état des lieux au-delà de la fenêtre servie

  par l''API — fenêtre qui dépend de la banque (LBP 90 j, Revolut 3727 j).

  CORRIGÉ LE 2026-08-01 — cet ordre disait « T2 devient nécessaire dès qu''un

  second canal arrive ». C''est FAUX depuis P24 — La Banque Postale ne fournit

  aucun identifiant de transaction utilisable, donc l''idempotence de la toute

  première synchro repose déjà sur l''empreinte de contenu, qui est le cœur de

  T2. T2 n''est pas différable — c''est une dépendance de T4, comme le déclare

  d''ailleurs déjà la clé dependances de T4.

  '
T1:
  objectif: Un backend Fastify + SQLite servi en HTTPS local, qui expose le solde disponible agrégé et
    par compte, et permet de saisir manuellement comptes et transactions. Vérifiable de bout en bout sans
    aucune dépendance externe.
  probleme_resolu: P1 (pas de vue fiable sur la trésorerie) pour sa partie calcul ; P13 (l'instance fait
    foi, le client ne stocke qu'un cache) ; P19 (le Livret A, absent de l'API, est alimenté par la saisie
    manuelle) ; P28 (Nickel non plus n'a d'accès API — vérifié sur le catalogue le 2026-08-01 — donc la
    saisie manuelle sert DEUX comptes, pas un, et n'est pas un repli mais le seul chemin pour eux).
  projets:
  - gestio
  dependances: []
  parallelisable_avec: []
  criteres_acceptation:
  - Créer un compte, y saisir des transactions et obtenir son solde par l'API.
  - LE MODÈLE À DEUX NIVEAUX N'EST PAS DANS CETTE TÂCHE — décision de Lamoms du 2026-08-01, prise APRÈS
    la livraison de l'issue 7. Il est porté par T4, où une connexion bancaire rend plusieurs comptes d'un
    même établissement et où le niveau manquant se fait sentir pour de bon. T1 livre donc UN SEUL niveau,
    des comptes à plat, sans groupe. CE QU'IL FAUT SAVOIR ET NE PAS DÉCOUVRIR PLUS TARD — T4 ROUVRIRA
    la table des comptes et l'endpoint d'agrégat livrés ici. C'est assumé, pas un débordement. Ce qui
    protège cette réouverture est le critère suivant — tant que l'agrégat somme des COMPTES et rien d'autre,
    ajouter un niveau au-dessus ne le casse pas.
  - Le solde agrégé est exactement la somme des soldes DES COMPTES, eux-mêmes sommes de leurs transactions.
    Aucun recalcul manuel nulle part. L'agrégat somme les COMPTES et RIEN D'AUTRE — cette règle vaut à
    un niveau comme à deux, et c'est elle qui empêchera le double comptage le jour où T4 posera les établissements
    au-dessus. Les montants sont des entiers de centimes, le sens est porté par le signe.
  - Les montants sont stockés en entiers de centimes, jamais en flottants.
  - Chaque transaction porte sa SOURCE (api, csv, pdf, manuel) et son EMPREINTE D'IDENTITÉ, définie comme
    le condensé stable de (compte, date ISO, montant en centimes, sens CRDT/DBIT, libellé normalisé).
    Cette empreinte porte l'idempotence — réingérer la même transaction ne crée pas de seconde ligne.
    PRÉCISION DU 2026-08-01, parce que trois notions circulaient sous le même mot — cette empreinte d'IDENTITÉ
    (T1) n'est PAS la clé de RAPPROCHEMENT de T2, qui vaut (date ISO, montant en centimes) et est volontairement
    plus lâche pour que le même mouvement vu par deux canaux différents se retrouve malgré des libellés
    qui divergent. Identité stricte d'un côté, rapprochement tolérant de l'autre — les deux coexistent
    et ne se remplacent pas. Elle n'est PAS entry_reference — ce champ est synthétique chez La Banque
    Postale et absent chez d'autres banques (P24, P25). LA SOURCE N'ENTRE PAS DANS L'EMPREINTE. Elle est
    stockée à côté, jamais hachée avec. Sinon le MÊME mouvement reçu par l'API puis par un import CSV
    produit deux empreintes différentes, donc deux lignes, et l'empreinte ne remplit plus son seul rôle
    — reconnaître un mouvement déjà connu quel que soit le canal qui l'apporte. PRÉCISION AJOUTÉE LE 2026-08-01
    parce que le critère d'origine, « chaque transaction porte sa source et son empreinte », se lisait
    dans les deux sens et a été implémenté avec la source DANS le hachage. Ambiguïté de ce plan, pas erreur
    de lecture. Le libellé est NORMALISÉ avant hachage — casse, accents et espaces multiples réduits.
    Mesuré sur les données réelles — le même mouvement s'écrit « DEFAULT REFERENCE » côté CSV et « REFERENCE
    » côté API, « LMW*SNCF » ici et « LMW SNCF » là. Sans normalisation, l'empreinte diverge sur des différences
    typographiques. UN INDEX UNIQUE porte l'empreinte en base. Sans lui elle ne garantit rien — l'idempotence
    doit être imposée par le schéma, pas seulement calculée. Le SENS est porté par le SIGNE du montant
    en centimes — négatif au débit, positif au crédit — et non par une colonne séparée. Le signe vient
    de credit_debit_indicator lorsque la source est l'API (P2), jamais du libellé.
  - La base est chiffrée au repos (SQLCipher via better-sqlite3-multiple-ciphers), la clé venant d'une
    variable d'environnement hors dépôt.
  - Le serveur répond en HTTPS sur le port 3443, soit https://localhost:3443/ (certificat auto-signé —
    la redirection est faite par le navigateur de l'utilisateur, aucune autorité de certification n'intervient).
    Ce n'est pas un choix — c'est l'URL de redirection enregistrée chez Enable Banking, et la banque y
    renvoie le navigateur APRÈS l'authentification forte. Un serveur en clair, ou sur un autre port, ferait
    échouer la connexion bancaire au dernier moment, une fois l'utilisateur déjà authentifié (P18). NE
    PAS utiliser le port 3000 — il est occupé en permanence sur la machine hôte par le serveur Lamoms
    (vérifié le 2026-08-01), ce qui empêche aussi de lancer les tests. Posé dès le socle parce que HTTPS
    touche l'origine servie au frontend et les cookies de session — le rétrofit coûte bien plus cher que
    la pose.
  - Une sauvegarde quotidienne est en place, avec rotation sur 30 jours. Elle se fait par `sqlcipher_export()`
    — PAS par `.backup`. CORRECTION DU 2026-08-01, erreur de ce plan signalée par Codex — le critère demandait
    `sqlite3 .backup` sur une base SQLCipher, ce qui est contradictoire — le shell répond "backup is not
    supported with encrypted databases", la copie page à page étant refusée entre bases chiffrées. `sqlcipher_export()`
    est l'outil documenté par Zetetic pour dupliquer une base vers une base attachée chiffrée. La sauvegarde
    doit rester CHIFFRÉE (vérifier que l'en-tête du fichier n'est pas du SQLite en clair) et se rouvrir
    avec la même clé — la preuve attendue est une lecture réelle dans le fichier de sauvegarde, pas sa
    seule existence.
  - Une sauvegarde qui n'a pas eu lieu sort en ERREUR, jamais en succès. AJOUTÉ LE 2026-08-02 —
    scripts/backup.sh:14-17 sort avec le code 0 quand GESTIO_DB_KEY est introuvable. Lancé par cron à
    3h17, personne ne lit sa sortie, donc cron enregistre un succès et se tait ; on peut croire des mois
    durant qu'on est sauvegardé alors que rien n'a jamais été écrit. Clé manquante, binaire sqlcipher
    absent, export échoué — code de sortie non nul dans les trois cas.
  validations:
  - npm run typecheck
  - npm test
  - Créer un compte + 3 transactions, vérifier le solde renvoyé par l'API.
  hors_perimetre:
  - Aucune interface graphique.
  - Aucune synchronisation bancaire.
  - Aucun import de fichier.
T2:
  objectif: Un moteur de déduplication qui, recevant des transactions de plusieurs canaux, produit un
    jeu sans doublon et sans perte. Traduction en TypeScript de l'algorithme déjà validé sur données réelles.
  probleme_resolu: P5 (deux transactions distinctes de même montant le même jour écrasées par une clé
    naïve) ; P11 (les preuves doivent s'appuyer sur les données réelles du lab, pas sur des jeux fabriqués).
  projets:
  - gestio
  dependances:
  - T1
  parallelisable_avec:
  - T3
  - T7
  criteres_acceptation:
  - Clé primaire (date ISO, montant en centimes), file FIFO par clé.
  - Le score de Jaccard sur les mots du libellé ne sert QUE de départage lorsque plusieurs candidats partagent
    la même clé. UNE SEULE EXCEPTION, AJOUTÉE LE 2026-08-02 — quand les DEUX libellés sont présents et ne
    partagent AUCUN mot après normalisation, il n'y a pas de rapprochement, quel que soit le nombre de
    candidats. Ce n'est pas un seuil de similarité, interdit par le hors-périmètre — c'est le cas zéro,
    binaire, un mot commun au moins ou aucun. Un libellé absent d'un côté ne déclenche rien, on ne peut
    rien exiger de ce qui n'existe pas (cas Trade Republic, voir plus bas). CETTE EXCEPTION EST PORTÉE PAR
    T8, PAS PAR L'ISSUE 8. Décision de Lamoms du 2026-08-02 — le défaut ne mord sur aucune donnée réelle
    (mesuré, aucun rapprochement sous 0,5 de score), il n'est donc pas urgent et ne justifie pas de rouvrir
    une issue relue et validée. Le code livré par l'issue 8 reste conforme au plan tel qu'il était écrit.
  - Le signe du montant vient de credit_debit_indicator (CRDT/DBIT), jamais déduit du libellé.
  - Rejoue le résultat de référence sur les données réelles du lab — 27 mouvements CSV contre 27 transactions
    API, 27 rapprochements, 0 orphelin de chaque côté.
  - Deux transactions réellement distinctes de même montant le même jour restent deux transactions. ATTENTION
    — ce cas n'existe PAS dans les 43 transactions réelles du lab (vérifié le 2026-07-31 — zéro collision
    date+montant). Il figure uniquement dans enable_banking_juin_bp.json, qui est un fichier FABRIQUÉ
    à partir du PDF — ne pas s'en servir comme preuve. Le cas doit donc être couvert par un test construit
    à la main.
  - L'ABSENCE DE LIBELLÉ est un cas traité, pas un effet de bord. Mesuré le 2026-08-01 sur Data Insights
    — Trade Republic n'expose ni remittance_information ni entry_reference, seulement booking_date, credit_debit_indicator,
    status et transaction_amount (voir P25). Le départage par Jaccard y est donc impossible par construction.
    RÈGLE — quand le libellé manque et que plusieurs candidats partagent la clé (date, montant), on NE
    FUSIONNE PAS. On conserve les transactions distinctes. Perdre un mouvement fausse le solde en silence
    ; en garder un en trop se voit et se corrige. Un test couvre explicitement ce cas — deux mouvements
    de même date et même montant, sans libellé, restent deux mouvements.
  - Un rapprochement indécidable est MARQUÉ « à départager », jamais tranché au hasard ni masqué. Les
    deux mouvements sont conservés en attendant l'arbitrage. Décision de Lamoms du 2026-08-01 — quand
    (date, montant, sens) ne suffisent pas et qu'il n'y a pas de libellé, les seules issues sont humaines
    ou documentaires — attendre le relevé de la banque, ou vérifier et départager à la main. Aucune heuristique
    n'est inventée pour combler ce trou (voir P25). Ce cas ne concerne QUE le croisement de canaux — sur
    un canal unique, deux mouvements de même date et même montant sont simplement deux mouvements.
  - Rejouer la même ingestion deux fois ne change ni le solde ni le nombre de transactions.
  validations:
  - npm test
  - Jeu de test constitué des fichiers réels de .lamoms/lab/agy/ (enable_banking_transactions_reelles.json
    et les deux CSV La Banque Postale).
  - Rejeu réel, REPRODUCTIBLE — lancer depuis la racine `node_modules/.bin/tsx .lamoms/lab/agy/rejeu-t2.ts`
    et vérifier 27 rapprochements, 0 orphelin et 0 à départager dans les deux ordres de canaux. AJOUTÉ LE
    2026-08-02 — ce rejeu avait été fait deux fois à la main puis jeté, il ne survivait que dans un
    commentaire de l'issue 8. Le script vit dans le lab, hors dépôt, parce qu'il lit des données bancaires
    réelles qui ne doivent jamais être versionnées ; aucun test de src/ ne peut donc en dépendre, et c'est
    pourquoi cette vérification reste manuelle. Variable GESTIO_DEDUP_MODULE pour viser un worktree.
  hors_perimetre:
  - Aucun seuil de similarité flou pour décider d'une fusion.
  - Aucune règle liée au contenu ou au commerçant.
T3:
  objectif: Authentification locale par mot de passe, et protection au repos des secrets de l'application.
  probleme_resolu: 'Exigence de sécurité du PRD : données financières, 1 utilisateur, aucune authentification
    cloud.'
  projets:
  - gestio
  dependances:
  - T1
  parallelisable_avec:
  - T2
  - T7
  criteres_acceptation:
  - Mot de passe stocké en Argon2id, jamais en clair ni réversible.
  - Une session invalide ou expirée interdit tout accès aux données.
  - Les secrets Enable Banking résident dans la base chiffrée ou hors dépôt — identifiant d'application,
    chemin de la clé privée, session_id des sessions autorisées. CORRIGÉ LE 2026-08-01 — ce critère disait
    « les jetons Enable Banking » et contredisait T4, qui établit qu'on ne gère AUCUN jeton d'accès ASPSP
    — Enable Banking les rafraîchit en interne. Il n'y a donc pas d'access token à stocker ; ce qui doit
    l'être, c'est l'identité de l'application et les sessions.
  - Aucun secret en clair dans le dépôt git, dans la base, dans les logs, ni dans une sauvegarde exportée.
    TRANCHÉ PAR LAMOMS ET HERMÈS LE 2026-08-02 — ce critère disait « aucun secret lisible en clair sur
    le disque », inatteignable par construction — la clé de la base doit rester lisible par le serveur
    pour qu'il redémarre sans intervention humaine (coupure de courant, reboot, synchro planifiée), et
    tout ce que le serveur retrouve seul, un utilisateur de la machine le retrouve aussi. La seule
    alternative — dériver la clé du mot de passe, rien sur disque — coûte le redémarrage autonome et
    rend un mot de passe oublié irréversible ; écartée pour le MVP. La protection réelle du chiffrement
    porte donc sur les copies qui QUITTENT la machine, pas sur la machine elle-même.
  - RISQUE RÉSIDUEL ASSUMÉ — quiconque dispose du compte utilisateur ou de la machine (PC volé, carte SD
    du RPi) lit tout, la clé étant à côté de la base. Hors modèle de menace du MVP mono-utilisateur. Même
    cause côté sauvegarde — une copie vers un support secondaire ne doit jamais emporter .env à côté de
    backups/, sinon elle réunit la base et son secret racine ; à traiter avec P37, hors T3.
  - .env et la clé privée Enable Banking sont hors du répertoire versionné, en mode 600. RISQUE CONNU,
    MESURÉ LE 2026-08-02 — chmod est INOPÉRANT sur /mnt/c (montage 9p sans option metadata), un fichier
    créé dans le workspace ressort en -rwxrwxrwx quoi qu'on fasse. La mesure ne vaut que sur le RPi et
    le rootfs WSL ; sur le PC hôte actuel elle n'existe pas. Ne pas la présenter comme acquise.
  validations:
  - npm test
  - Vérifier qu'aucun secret n'apparaît en clair dans la base ni dans les logs.
  hors_perimetre:
  - Multi-utilisateur, comptes, rôles.
  - Biométrie et déverrouillage sans mot de passe.
T4:
  objectif: Connecter une banque via Enable Banking, rapatrier les transactions réelles et tenir à jour
    la fraîcheur du solde.
  probleme_resolu: 'P2 (l''accès production fonctionne, avec ses limites mesurées) ; P12 (authentification
    forte encaissée par le serveur — PC puis RPi) ; P18 (redirect_url : ne pas reprendre celle du script
    du lab) ; P5 pour sa part MVP (idempotence de la resynchronisation).'
  projets:
  - gestio
  dependances:
  - T1
  - T2
  parallelisable_avec:
  - T5
  - T6
  criteres_acceptation:
  - UN ÉTABLISSEMENT N'A PAS DE SOLDE STOCKÉ — le sien est calculé à la volée comme la somme de ses comptes,
    et l'agrégat somme les COMPTES, jamais les groupes. Additionner un groupe avec ses propres comptes
    compterait tout deux fois, et le total serait faux EN AYANT L'AIR JUSTE — le mode de panne que ce
    projet doit empêcher. Un test couvre explicitement ce cas — un établissement à trois comptes ne contribue
    à l'agrégat que pour la somme de ces trois-là. La migration qui ajoute le niveau doit rattacher les
    comptes existants sans changer le total agrégé — même chiffre avant et après, c'est la preuve attendue.
  - MODÈLE À DEUX NIVEAUX — un ÉTABLISSEMENT groupe des COMPTES, et seul un compte porte un solde et des
    transactions. Décision de Lamoms du 2026-08-01 (P28), rattachée à T4 et non à T1 par choix du même
    jour, l'issue 7 étant déjà livrée et relue. Six comptes au départ, tous utilisés — La Banque Postale
    groupe le Compte Courant Postal, le Livret A et le Livret Jeune Swing ; Revolut groupe son compte
    et ses pockets ; Nickel et Trade Republic ont un compte chacun. C'EST ICI QUE LE NIVEAU MANQUE VRAIMENT
    — une seule session Enable Banking rend PLUSIEURS comptes pour un même établissement, et rien ne permettrait
    de les rattacher. CETTE TÂCHE ROUVRE DONC LE SCHÉMA DES COMPTES ET L'ENDPOINT D'AGRÉGAT livrés par
    T1 ; c'est prévu et cadré, pas un hors-sujet. Ne rien coder qui suppose un seul niveau ni un seul
    compte par établissement.
  - Connexion par le pattern Out-of-Band — le backend produit l'URL bancaire, le client l'ouvre à l'extérieur
    puis interroge le backend jusqu'à ce que la session soit établie. Le backend reçoit le retour de la
    banque.
  - redirect_url = https://localhost:3443/ — l'URL du MVP, réellement enregistrée par l'utilisateur. Le
    port 3000 est occupé par le serveur Lamoms sur la machine hôte, donc https://localhost:3000/ (également
    enregistrée) n'est PAS utilisable ici. NE PAS reprendre http://localhost:3000/callback, présente dans
    le script du lab et non enregistrée — l'échec surviendrait après l'authentification forte.
  - Le libellé est lu dans remittance_information (liste de chaînes, à joindre), et non dans remittance_information_unstructured.
  - Le montant de transaction_amount est non signé — le sens vient de credit_debit_indicator.
  - La PREMIÈRE récupération de transactions après l'établissement d'une session se fait avec strategy=longest
    et immédiatement. RÉSERVE LEVÉE LE 2026-08-01 — l'énumération TransactionsFetchStrategy ne compte
    que DEUX valeurs, default et longest, vérifié sur la page de référence Enable Banking. longest cherche
    la transaction la plus ancienne disponible et remonte depuis ce point au lieu d'échouer quand la période
    demandée n'est pas servie ; date_from n'y est qu'une borne basse indicative, date_to est IGNORÉ, et
    longest ne renvoie jamais WRONG_TRANSACTIONS_PERIOD — au pire une liste vide. CE QUE LA MESURE A CHANGÉ
    — la documentation promet un historique complet pendant environ une heure après l'autorisation. Mesuré
    sur La Banque Postale, cette fenêtre n'apporte RIEN — trente secondes après une authentification forte
    neuve, deux heures plus tard, et sur une session vieille de deux jours, les trois appels rendent EXACTEMENT
    les mêmes 43 transactions remontant au 2026-05-04, identiques ligne à ligne (P23). NE PAS bâtir de
    course contre la montre autour du premier appel. Garder longest et l'appel immédiat reste juste, mais
    comme précaution bon marché pour une banque plus généreuse — pas comme un sauvetage.
  - Le nombre de transactions rapatriées et la date de la plus ancienne sont journalisés à chaque synchro,
    pour que la profondeur réellement obtenue soit constatable au lieu d'être supposée.
  - LA PAGINATION VA JUSQU'À DISPARITION DE LA CLÉ, jamais jusqu'à la première page vide. La documentation
    Enable Banking est explicite — on peut recevoir une liste VIDE accompagnée d'une continuation_key,
    ce qui signifie que les transactions ne sont pas disponibles pour l'instant mais qu'il peut y en avoir
    d'autres. S'arrêter sur une réponse vide, réflexe naturel, tronque l'historique au milieu sans erreur
    ni message (P33). MESURÉ EN DIRECT LE 2026-08-01 — avec strategy=longest, La Banque Postale renvoie
    QUATRE pages VIDES portant chacune une clé, puis une cinquième page qui contient les 43 transactions.
    La clé décodée montre un état de recherche interne, stage égal à search et un numéro d'étape de 1
    à 4. Un code qui s'arrête à la première page vide rapatrie ZÉRO transaction sur cette banque, sans
    la moindre erreur. Ce n'est pas un cas de bord théorique, c'est le comportement NOMINAL de la première
    aspiration.
  - L'aspiration profonde écrit en base PAGE PAR PAGE, jamais en accumulant pour n'écrire qu'à la fin.
    Un plantage à la douzième page doit laisser les onze premières acquises. La progression est journalisée
    — pages parcourues, transactions écrites, date de la plus ancienne, et si l'arrêt vient de l'épuisement
    des clés ou d'une erreur. Sans ce journal, un historique tronqué ressemble à un historique complet.
  - Le HTTP 429 / ASPSP_RATE_LIMIT_EXCEEDED est un état NORMAL, pas une panne. Beaucoup de banques limitent
    à 4 récupérations par jour hors présence de l'utilisateur, et la documentation dit qu'il n'existe
    aucun contournement — la reprise se fait après 6 heures. Le code le traite comme tel et le rend visible
    avec la date de la dernière synchro réussie. COROLLAIRE — ne PAS resynchroniser à chaque ouverture
    d'écran. Afficher le dernier solde connu avec sa date ne coûte aucun appel ; une app trop bavarde
    épuise le quota en une matinée puis fige le solde sans le dire. NON RÉSOLU — ce qui déclenche le régime
    « PSU absent » chez nos banques reste inconnu ; elles n'exigent aucun en-tête PSU (mesuré, P33). Question
    confiée à AGY. Concevoir prudemment en attendant.
  - Chaque compte porte une DATE D'HORIZON CONNU — la date de sa plus ancienne transaction effectivement
    obtenue. Elle est stockée, pas recalculée à la volée, et jamais reculée par une synchro ultérieure
    plus courte. RAISON — deux situations sont indiscernables dans une réponse HTTP 200 — « aucune transaction
    sur cette période » et « la banque a tronqué sans le dire ». Le 422 WRONG_TRANSACTIONS_PERIOD est
    un refus EXPLICITE et se traite ; la troncature silencieuse, elle, ne s'annonce pas. On ne peut donc
    pas prouver l'absence de transactions avant l'horizon connu — on ne peut que dire jusqu'où l'on sait.
    Tout ce qui précède cette date est INCONNU, jamais VIDE (voir P22, P23). L'horizon obtenu est une
    BORNE BASSE de ce compte à cet instant, pas le plafond de la banque — un compte ouvert il y a huit
    mois rend huit mois, ce qui ne dit rien de ce que la banque aurait servi sur un compte plus ancien.
    Ne jamais promouvoir une mesure en constante par banque — c'est l'erreur de P21 et P22, la troisième
    fois qu'elle se présente.
  - La fenêtre d'historique est respectée et rendue visible — au-delà, le manque est signalé, jamais présenté
    comme un solde complet. La banque refuse elle-même toute demande plus ancienne — HTTP 422, error =
    WRONG_TRANSACTIONS_PERIOD (vérifié en direct le 2026-07-31 sur La Banque Postale, à 200 jours). Ce
    code doit être traité, pas laissé remonter en erreur brute — et c'est LUI qui fait autorité sur la
    fenêtre réelle. PRÉCISION DU 2026-08-01 — les 90 jours sont constatés SUR LA BANQUE POSTALE, ce n'est
    pas une constante Enable Banking (leur documentation indique que la plupart des ASPSP donnent au moins
    un an). Ne pas coder 90 en dur comme une propriété de l'API — toute autre banque aura sa propre fenêtre.
  - L'expiration du consentement est lue dans access.valid_until renvoyé par GET /sessions/{id} — JAMAIS
    une durée codée en dur. La session réelle du lab porte valid_until = 2027-01-01, la valeur demandée
    à la création et accordée par la banque. Son expiration est détectée et donne lieu à un chemin de
    reconnexion, sans effacer le dernier solde connu.
  - La durée demandée dans valid_until du POST /auth ne dépasse pas maximum_consent_validity, valeur en
    SECONDES que GET /aspsps renvoie pour la banque visée. C'est un plafond PAR BANQUE — 180 jours pour
    la majorité des ASPSP, plafond issu de l'amendement EBA RTS de 2022 qui a porté le renouvellement
    de SCA de 90 à 180 jours pour l'accès AIS. On lit ce plafond, on ne le suppose pas. PRÉCISION DU 2026-08-01
    — les 180 jours sont donc réels comme plafond ; ce qui était faux, c'est de les traiter comme la durée
    effective.
  - Le jeton d'accès ASPSP n'est PAS à gérer — Enable Banking le rafraîchit en interne lors des requêtes
    de données. Ne rien coder qui stocke, rafraîchisse ou fasse expirer un access token ; seule la session
    porte une échéance.
  - La devise vient du solde (balances[].balance_amount.currency), jamais du compte — GET /accounts/{uid}/details
    renvoie currency = "XXX" sur le compte réel alors que le solde est bien en EUR.
  - L'identité d'une transaction NE repose PAS sur entry_reference. Mesuré sur les 43 transactions réelles
    du lab — entry_reference vaut toujours booking_date suivi d'un rang dans la journée (2026-07-20.0
    à .4), et transaction_id est null 43/43. Il n'existe donc aucun identifiant émis par la banque, et
    un rang se décale dès qu'une transaction s'ajoute sur une date déjà connue. L'idempotence repose sur
    une empreinte calculée à partir du contenu — compte, date ISO, montant en centimes, sens CRDT/DBIT,
    libellé normalisé (voir P24). CE POINT EST INFÉRÉ, PAS MESURÉ — le décalage des rangs se déduit de
    la structure du champ ; il se prouverait en relisant la même période et en comparant les entry_reference.
    Tant que ce test n'a pas eu lieu, on ne pose pas d'index unique sur ce champ.
  - Resynchroniser deux fois de suite ne change ni le solde ni le nombre de transactions.
  - UNE CLÉ DE CONTINUATION NE SE REJOUE JAMAIS SEULE — tous les paramètres de la requête initiale doivent
    être renvoyés avec elle, strategy comprise. Mesuré le 2026-08-01 — la clé renvoyée sans strategy=longest
    produit un HTTP 422 WRONG_CONTINUATION_KEY. C'est la faute exacte qui a interrompu le premier script
    de mesure ; le second, qui conservait les paramètres, a paginé en cinq pages sans incident. Le piège
    est sournois — le premier appel réussit, seul le second échoue (P34).
  - LE SOLDE NE SE RECALCULE PAS À PARTIR DES TRANSACTIONS. Mesuré le 2026-08-01 — balance_after_transaction
    est null sur 43 transactions sur 43 chez La Banque Postale. Le solde vient de GET /accounts/{uid}/balances,
    et de là seulement. Un cumul maison partirait du plus ancien mouvement disponible, qui est une troncature
    à quatre-vingt-dix jours et non l'ouverture du compte — donc d'un point de départ inconnu, pour dériver
    ensuite en silence (P36).
  - La synchronisation déclenchée par l'utilisateur PORTE les en-têtes PSU, psu-ip-address et psu-user-agent
    ; la synchronisation automatique de fond ne les porte pas. Sourcé le 2026-08-01 — « when at least
    one PSU header is included, any limitations imposed by the ASPSP on background transaction fetching
    do not apply », et la documentation RECOMMANDE fortement de les fournir dès qu'un utilisateur est
    détecté présent. Les trois banques du périmètre ne les EXIGENT pas, ce qui ne dispense pas de les
    envoyer — c'est ce qui distingue les deux régimes de quota (P33). Ne pas les inventer quand personne
    n'est là.
  validations:
  - npm test
  - Synchronisation réelle sur le compte de l'utilisateur, puis relance immédiate — le solde et le nombre
    de transactions doivent être identiques.
  - Deux applications existent chez Enable Banking ; l'une répond 403 "Application is not active". Le
    kid retenu est celui vérifié actif le 2026-07-31 (93fca3d0-...). Un 403 à l'authentification signifie
    mauvaise application, pas mauvais code.
  hors_perimetre:
  - Authentification forte initiée depuis le mobile — hors périmètre du MVP, mais ce n'est PAS un choix
    d'architecture — le callback est encaissé par le serveur, et la seule chose qui l'empêche est que
    https://localhost:3443/ ne résout que sur la machine serveur. Le jour où la redirect_url devient https://gestio.software/auth/callback,
    ça marche sans retoucher le code. Ne rien coder qui interdise structurellement ce cas — pas de contrôle
    sur l'appareil appelant, pas de chemin en dur.
  - Toute exposition publique de l'instance (ni Tailscale Funnel, ni nom .ts.net).
T5:
  objectif: Importer un relevé CSV bancaire et l'intégrer sans doublon, en refusant explicitement tout
    format non reconnu.
  probleme_resolu: 'P3 (absence de norme CSV bancaire française : encodage, séparateur, formats de date
    et de montant variables selon la banque).'
  projets:
  - gestio
  dependances:
  - T1
  - T2
  parallelisable_avec:
  - T4
  - T6
  - T7
  criteres_acceptation:
  - Registre de formats par banque. DEUX banques à couvrir, pas une — les comptes sont réels et portent
    de l'argent (P28). La Banque Postale — les deux CSV réels du lab servent de référence. Format constaté
    le 2026-08-01 — encodage ISO-8859-1 et NON UTF-8 (« Numéro Compte » est illisible si on lit en UTF-8),
    séparateur point-virgule, un en-tête de 5 lignes clé;valeur suivi d'une ligne vide, puis l'en-tête
    réel « Date;Libellé;Montant(EUROS) ». Date au format JJ/MM/AAAA, montant SIGNÉ avec la virgule pour
    décimale (-10,00). Les libellés sont entre guillemets et portent une espace finale. L'en-tête donne
    le solde de fin et sa date, utilisables en contrôle. Revolut — référence dans "/mnt/c/Users/djabi/Documents/relevé
    pdf/revolut/", relevé de 254 lignes couvrant 2025-09-01 à 2026-06-14. Format constaté le 2026-08-01
    — UTF-8, séparateur virgule, en-têtes en français (Type, Produit, Date de début, Date de fin, Description,
    Montant, Frais, Devise, État, Solde). Le montant est SIGNÉ dans la colonne Montant, il n'y a pas d'indicateur
    de sens comme sur l'API. Une colonne Solde donne le solde après opération et sert de contrôle. Les
    dates portent l'heure (2025-09-27 13:05:08) — la clé de rapprochement de T2 est la date SEULE, donc
    tronquer à la date ISO sans perdre l'heure en base. Attention aussi à la colonne Frais, distincte
    du montant.
  - Un fichier dont le format n'est pas reconnu est refusé avec un message nommant ce qui n'est pas compris.
    Jamais d'ingestion partielle, jamais de parsing approximatif.
  - Les variations d'encodage et de séparateur sont gérées sans perte d'accents. Le cas est RÉEL et mesuré,
    pas théorique — les deux banques du registre s'opposent sur les trois axes à la fois. La Banque Postale
    est en ISO-8859-1 avec séparateur point-virgule, virgule décimale et date JJ/MM/AAAA ; Revolut est
    en UTF-8 avec séparateur virgule, point décimal et date ISO horodatée. Lire l'un avec les règles de
    l'autre produit soit des accents cassés, soit des montants faux.
  - Le libellé d'un même mouvement DIFFÈRE entre l'API et le CSV de la même banque. Vérifié sur les trois
    virements du Livret A — le CSV écrit « VIREMENT DE MR <NOM> DEFAULT REFERENCE » là où l'API écrit
    « VIREMENT DE MR <NOM> REFERENCE », le reste du libellé (deux-points, espace, numéro de référence)
    étant identique, et le CSV ajoute en plus une espace finale. La normalisation du libellé (T1) doit
    absorber cet écart, sinon le même mouvement porte deux empreintes et l'import crée un doublon.
  - Importer deux fois le même fichier ne change pas le solde.
  - Un import croisant une période déjà synchronisée par l'API ne crée aucun doublon et ne perd aucune
    transaction.
  validations:
  - npm test
  - Importer les deux CSV réels du lab sur une base déjà synchronisée par l'API, puis vérifier l'absence
    de doublon et d'orphelin.
  hors_perimetre:
  - Détection automatique d'une banque inconnue.
  - Correction ou complétion des données du fichier.
T6:
  objectif: Importer un relevé PDF en s'appuyant sur sa couche texte, pour constituer l'historique ancien
    que le CSV ne couvre pas.
  probleme_resolu: 'L''état des lieux au-delà de la fenêtre servie par l''API — l''historique ancien de
    l''utilisateur n''existe que sous forme de relevés PDF. JUSTIFICATION CONFIRMÉE le 2026-08-01 après
    vérification (P23). Elle avait été mise en doute quelques heures plus tôt, à tort — Enable Banking
    publie « Available transaction period: 90 days » pour La Banque Postale dans Data Insights, ce qui
    corrobore le HTTP 422 mesuré en direct. Deux sources indépendantes — l''historique ancien est donc
    bien hors de portée de l''API en régime courant, et l''import PDF garde tout son sens. RÉSERVE LEVÉE
    LE 2026-08-01, PAR LA MESURE — la fenêtre d''une heure annoncée par la documentation n''apporte RIEN
    chez La Banque Postale. Trois aspirations avec strategy=longest, l''une trente secondes après une
    authentification forte neuve, l''une deux heures plus tard, l''une sur une session vieille de deux
    jours, rendent EXACTEMENT le même jeu de 43 transactions remontant au 2026-05-04, identiques ligne
    à ligne. Et le plancher est bien une TRONCATURE, pas l''âge du compte — la plus ancienne transaction
    rendue est un DÉBIT de 180 euros, impossible sur un compte qui viendrait de naître, et douze relevés
    PDF remontent à juillet 2025. T6 n''est donc PAS un repli — c''est le SEUL chemin vers l''état des
    lieux au-delà de quatre-vingt-dix jours glissants, et ce plancher glisse d''un jour par jour (P35).'
  projets:
  - gestio
  dependances:
  - T1
  - T2
  parallelisable_avec:
  - T4
  - T5
  - T7
  criteres_acceptation:
  - Extraction depuis la couche texte du PDF, sans OCR.
  - Un PDF dépourvu de couche texte est refusé avec un message explicite proposant le CSV ou la saisie
    manuelle.
  - Un relevé multi-comptes est ventilé sur les bons comptes. CE N'EST PAS UN CAS THÉORIQUE — le relevé
    de La Banque Postale contient TROIS comptes, vérifié le 2026-08-01 sur les 12 relevés réels (P32).
    Structure à exploiter, dans cet ordre — a) le bloc « Situation de vos comptes au <date> », qui donne
    le solde de chaque compte à la date du relevé (Compte Courant Postal, Livret A, Livret Jeune Swing)
    ; b) la section du compte courant ; c) la section « Comptes d'Épargne », qui est un relevé COMPLET
    du Livret A — son IBAN, un « Ancien solde au <date> », ses mouvements ligne à ligne, un « Nouveau
    solde au <date> ». SEGMENTER PAR COMPTE AVANT DE LIRE LA MOINDRE LIGNE. Lire le texte du document
    sans le découper attribue les mouvements au mauvais solde — le récurrent « VIREMENT DE M DJABI BAMBURAM
    15,00 » est un versement sur le LIVRET A, pas sur le compte courant, et c'est l'erreur que j'ai moi-même
    commise en analysant ces relevés.
  - L'arithmétique de chaque compte est vérifiée à l'import — ancien solde plus mouvements égale nouveau
    solde, par compte. Contrôle gratuit et sans appel, qui échoue bruyamment si la segmentation ou le
    parsing dérape.
  - Le Livret A n'est PAS alimenté seulement par saisie manuelle. Ces relevés fournissent 12 points de
    solde et 45 mouvements, intérêts capitalisés au 31 décembre inclus. La saisie manuelle ne sert qu'entre
    deux relevés.
  - Les 12 relevés réels La Banque Postale servent de référence. Ils vivent hors du dépôt, et se lisent
    par chemin absolu — /mnt/c/Users/djabi/Documents/relevé pdf/bp/ ATTENTION AU NOMMAGE, deux pièges
    vérifiés le 2026-08-01 — le dossier s'écrit « relevé pdf », avec accent et avec une espace ; et les
    fichiers BP n'ont AUCUNE EXTENSION, ils s'appellent releve_CCP0984209Z024_AAAAMMJJ. Les énumérer par
    motif releve_* et non par *.pdf, sans quoi on n'en trouve aucun. Ce sont bien des PDF — vérifié, PDF
    1.6, 4 pages, 100 objets /Font, couche texte présente, donc parsables sans OCR. Couverture — 08/07/2025
    à 08/06/2026, un relevé par mois.
  - NICKEL est le SECOND format de relevé à couvrir, pas une extension optionnelle. Nickel n'a AUCUN accès
    API chez Enable Banking — vérifié le 2026-08-01, zéro occurrence sur les 2632 banques du catalogue
    (P28) — donc le PDF est, avec la saisie manuelle, son seul canal. 9 relevés dans "/mnt/c/Users/djabi/Documents/relevé
    pdf/nickel/", de 2025-09 à 2026-05, nommés AAAA-M-JJMMAARM40001128530.pdf. Vérifiés — PDF 1.4, 1 page,
    couche texte présente, parsables sans OCR. Le dossier contient aussi des fichiers sans rapport (apk,
    exe, zip, une convocation) — n'énumérer que le motif *RM*.pdf. Le projet antérieur /mnt/c/Users/djabi/Documents/releves-pdf
    sert de référence de LOGIQUE de parsing, sans être appelé ni porté tel quel — le parsing est réécrit
    en TypeScript. Il ne s'appelle PAS gestio-releves, contrairement à ce que ce plan indiquait.
  - Importer deux fois le même relevé ne change pas le solde.
  validations:
  - npm test
  - Importer les 12 relevés réels de "/mnt/c/Users/djabi/Documents/relevé pdf/bp/" (motif releve_*, sans
    extension) et comparer les totaux extraits aux soldes de début et de fin imprimés sur les relevés.
  hors_perimetre:
  - OCR et PDF scannés.
  - PDF protégés par mot de passe.
T7:
  objectif: 'L''interface mobile et desktop : voir son solde disponible, sa fraîcheur, sa répartition
    par compte et ses transactions.'
  probleme_resolu: P1 (la Core Feature, pour sa partie visible) ; P16 (mode hors connexion, imposé par
    la limite assumée du PC hôte). DÉPENDANCE AJOUTÉE LE 2026-08-01 — T4, parce que le critère des deux
    niveaux (répartition établissement puis comptes) ne peut pas être satisfait avant que T4 ait posé
    ce modèle. L'ordre conseillé T1 puis T4 puis T7 le prévoyait déjà.
  projets:
  - gestio
  dependances:
  - T1
  - T4
  - T10
  parallelisable_avec:
  - T2
  - T3
  - T5
  - T6
  - T9
  criteres_acceptation:
  - À l'ouverture, le solde agrégé s'affiche sans aucune action préalable, accompagné de sa date de fraîcheur.
  - La répartition suit les DEUX NIVEAUX — établissement, puis comptes. La Banque Postale montre son Compte
    Courant, son Livret A et son Livret Jeune Swing ; Revolut montre son compte et ses pockets (P28).
    Le solde d'un établissement affiché est la somme de ses comptes, jamais un chiffre stocké.
  - La répartition par compte est atteignable en un geste, sans navigation. Ce n'est pas un raffinement
    de l'agrégat — c'est la moitié de la réponse. Formulation de Lamoms le 2026-08-01 — savoir combien
    il a lui dit combien il a dépensé, et surtout COMBIEN IL PEUT DÉPENSER ET OÙ. Un total sans sa ventilation
    ne permet pas de décider d'une dépense (P29).
  - "Hors connexion — cas courant lorsque le PC hôte est éteint — le dernier solde connu s'affiche\
    \ avec sa date (« solde au 30/07 à 18 h 12 »), et il est dit explicitement que le chiffre n'est\
    \ pas actuel. Jamais d'écran d'erreur nu, jamais un chiffre périmé présenté comme actuel.\
    \ CRITÈRE REQUALIFIÉ LE 2026-08-03 (D2, Hermès) — il imposait IndexedDB. Le besoin est de\
    \ PERSISTER UN SEUL OBJET côté navigateur avec sa date ; localStorage suffit au MVP et tient en\
    \ une ligne. Le moteur de stockage n'est pas le besoin, il n'entre pas dans le critère."
  - "Les rapprochements marqués « à départager » sont atteignables et arbitrables par l'utilisateur —\
    \ c'est lui qui tranche, avec son relevé. Tant qu'un doute n'est pas levé, il est visible ; le\
    \ solde n'est jamais présenté comme certain en le passant sous silence. CONTRAT FIGÉ LE 2026-08-03\
    \ (R1 puis C1, Hermès) — T7 LIT needs_review comme un marqueur opaque et POSE resolved_at quand\
    \ l'utilisateur tranche. Il ne réimplémente jamais la règle de POSE, qui appartient à T8, ni la\
    \ condition de REMISE, qui appartient à T10. Deux précisions d'exécution — la résolution porte sur\
    \ TOUT le groupe et jamais sur une seule ligne, sans quoi les autres se font re-marquer à la\
    \ synchro suivante ; et comme aucun appariement n'est stocké, le groupe se reconstitue par la clé\
    \ de déduplication (transaction_date, amount_cents), celle du critère 1 de T2."
  - Rien n'est jamais présenté comme un historique complet avant la date d'horizon connu du compte. L'interface
    dit « connu depuis le JJ/MM », pas « aucune transaction avant » — la différence n'est pas cosmétique
    — un solde calculé sur un historique tronqué a l'air juste et ne l'est pas, c'est le mode de panne
    que la Core Feature ne tolère pas.
  - Aucun cas limite ne mène à une page blanche — consentement expiré, banque indisponible, aucun compte
    connecté, trou d'historique — chacun mène à une destination et à une action claires.
  - La navigation suit la question de l'utilisateur (combien j'ai, où, quoi), jamais l'architecture technique.
    Synchroniser et importer ne sont pas des rubriques de navigation mais des actions situées là où le
    besoin apparaît.
  - Premier lancement — l'écran d'accueil est le couloir d'onboarding qui mène à la première valeur —
    voir son vrai solde — et non un écran vide.
  - Chaque action clé produit un retour immédiat (comptes connectés, solde mis à jour, transactions ajoutées
    et doublons ignorés).
  - "UNE SEULE INTERFACE, IDENTIQUE SUR PC ET SUR TÉLÉPHONE. Une colonne mobile-first, lisible telle\
    \ quelle sur desktop. La logique métier et le state sont partagés et vivent HORS du DOM\
    \ (src/ui-logic.ts), ce qui rend la différenciation ultérieure possible sans réécriture.\
    \ CRITÈRE REQUALIFIÉ LE 2026-08-03 PAR LAMOMS — il exigeait des layouts mobile et desktop\
    \ DIFFÉRENCIÉS par breakpoints. Ce n'est pas le besoin au MVP, qui est de vérifier que le\
    \ backend et le frontend fonctionnent ensemble de bout en bout, sur les deux appareils, avec le\
    \ MÊME parcours. La différenciation desktop est une amélioration ultérieure, hors périmètre."
  - "LA FRAÎCHEUR D'UN AGRÉGAT EST LE updatedAt LE PLUS ANCIEN DE SES COMPTES, jamais le plus récent.\
    \ Règle figée par Claude le 2026-08-03, à ne pas laisser au choix — sinon un total est daté\
    \ d'aujourd'hui alors qu'un compte n'a pas bougé depuis trois semaines, et c'est exactement le\
    \ mode de panne que la Core Feature ne tolère pas. GET /balance rend un updatedAt PAR COMPTE\
    \ (src/server.ts:391) et aucun au niveau du total ; c'est donc au consommateur de le dériver."
  - "QUATRE ROUTES MANQUANTES ENTRENT DANS T7 (D4, Hermès) — ce sont les conséquences directes de ses\
    \ critères, pas du hors-sujet. (1) GET /auth/state, PUBLIQUE, rend { configured } — sans elle le\
    \ frontend ne distingue pas « jamais configuré », qui mène à l'onboarding, de « déconnecté », qui\
    \ mène au login. (2) GET /transactions, filtrable par compte (accountId) et par « à départager »\
    \ (needsReview) — aucune route ne lit les transactions aujourd'hui, seul POST /transactions\
    \ existe. Sa forme est fixée ici pour ne pas être inventée en codant — ORDER BY\
    \ transaction_date DESC, id DESC, limit par défaut 100, offset. Quatre-vingt-dix jours font\
    \ quelques centaines de lignes et 100 remplit l'écran ; aucun curseur tant que ce n'est pas\
    \ mesuré. (3) L'arbitrage —\
    \ POST /transactions/resolve pour « ce sont bien deux dépenses distinctes » et\
    \ DELETE /transactions/:id pour « c'est le même mouvement en double ». Sans la suppression,\
    \ l'utilisateur ne peut que confirmer, jamais corriger. (4) Le service des fichiers statiques."
  - "LE FRONTEND VIT DANS web/, CONSTRUIT PAR VITE VERS dist/web, SERVI PAR @fastify/static (D3,\
    \ Hermès). Un seul processus, portable vers le Raspberry Pi sans réécriture. Deux pièges à ne pas\
    \ découvrir en codant — la branche SANS PARAMÈTRES de GET / (src/server.ts:89-91) rend désormais\
    \ index.html, tandis que la branche code+state du rappel bancaire reste INTACTE ; et les fichiers\
    \ statiques comme /auth/state doivent être publics, sans quoi la page de connexion reçoit elle-même\
    \ un 401 et l'application est inatteignable."
  - "EN DÉVELOPPEMENT, VITE PASSE PAR server.proxy VERS LE BACKEND (C3). Le cookie de session porte\
    \ HttpOnly, Secure et SameSite=Strict (src/server.ts:532) ; deux origines distinctes, Vite sur son\
    \ port et l'API sur le sien, empêchent son envoi et rendent la connexion impossible. Le navigateur\
    \ ne doit voir QU'UNE origine. DESSERRER SameSite EST INTERDIT — ce serait livrer une régression de\
    \ sécurité par accident, pour un problème d'outillage."
  - "LE MODE HORS CONNEXION A UNE SEULE SOURCE DE VÉRITÉ (D1 et D2 combinés). Le service worker est\
    \ MINIMAL et ne met en cache QUE la coquille de l'application — HTML, JS, CSS ; il ne met PAS\
    \ /balance en cache. Le dernier solde connu est persisté séparément avec sa date. Deux stockages\
    \ donneraient deux dates de fraîcheur divergentes et l'interface devrait arbitrer entre elles, ce\
    \ qui recrée le chiffre qui a l'air juste. Sans service worker, le critère hors connexion est\
    \ intenable — c'est le PC hôte éteint qui SERT le frontend, donc sans coquille en cache le\
    \ navigateur n'obtient même pas la page."
  - "LA LOGIQUE MÉTIER VISIBLE VIT DANS DES MODULES TYPESCRIPT PURS, testés par node --test (D5,\
    \ Hermès). Fraîcheur agrégée, regroupement à deux niveaux, reconstitution des groupes à départager,\
    \ libellé « connu depuis le JJ/MM » — tout cela se raisonne sans DOM et doit être testable sans\
    \ lui. AUCUN runner frontend au MVP, ni vitest ni jsdom. Un écran non testé est acceptable ; une\
    \ règle de calcul non testée ne l'est pas."
  - "UN « À DÉPARTAGER » EST UNE PROPRIÉTÉ DU GROUPE, PAS DE LA LIGNE. Une transaction seule dans son\
    \ groupe (transaction_date, amount_cents) n'est JAMAIS présentée comme ambiguë, même si\
    \ needs_review vaut 1 — rien ne remet jamais needs_review à 0, src/server.ts:744 est la seule\
    \ écriture de cette colonne et ne pose que 1. Sans cette règle, l'utilisateur supprime le doublon\
    \ et le survivant garde son marqueur pour toujours. LE MÊME PRÉDICAT GARDE LA ROUTE —\
    \ DELETE /transactions/:id REFUSE une transaction sans jumeau dans son groupe : sur une ligne\
    \ isolée, la déduplication de la synchro suivante ne trouve aucun candidat\
    \ (src/deduplication.ts:24, candidates.length === 0), la repousse dans transactions et la\
    \ RÉINSÈRE — la suppression serait défaite en silence, il n'existe aucune pierre tombale en base.\
    \ DELETE NE POSE PAS resolved_at : sur un groupe de trois, cela éteindrait une ambiguïté encore\
    \ réelle entre les deux lignes restantes, que le WHERE resolved_at IS NULL de T10 empêcherait\
    \ ensuite de re-signaler. Le regroupement vit dans UNE fonction de src/ui-logic.ts et aucun\
    \ consommateur ne lit needs_review directement, sinon un compteur affiché ailleurs réintroduit le\
    \ défaut. Deux tests — un groupe de taille 1 n'est pas affiché, un DELETE sur ligne isolée est\
    \ refusé."
  - "LA SUPPRESSION RETIRE LA LIGNE DU CANAL QUI NE SE RESYNCHRONISE PAS, JAMAIS L'AUTRE. Quand\
    \ l'utilisateur dit « c'est le même mouvement en double », DELETE /transactions/:id porte sur une\
    \ ligne dont source vaut CSV_IMPORT, PDF_RELEVE ou MANUEL (src/server.ts:240, :314, :554), jamais\
    \ sur une ligne ENABLE_BANKING. Si TOUT le groupe vient de l'API, la suppression est REFUSÉE et\
    \ le seul arbitrage possible reste « garder les deux » — une écriture réellement postée deux fois\
    \ par la banque n'a de toute façon pas à disparaître du dépôt.\
    \ RAISON, MESURÉE APRÈS T8 LE 2026-08-03 : T8 a rendu l'appariement à candidat unique CONDITIONNEL\
    \ (src/deduplication.ts:28-30, matchIndex ne vaut 0 que si un des deux libellés est vide OU si le\
    \ score de Jaccard est strictement positif). Deux libellés sans mot commun ne s'apparient donc\
    \ plus. Supprimer la ligne ENABLE_BANKING d'une telle paire la fait REVENIR à la synchronisation\
    \ suivante, et le groupe se fait re-marquer ; supprimer la ligne CSV ou PDF tient, puisque la\
    \ ligne API restante s'apparie à son entrante avec un score de 1. Sans cette règle, le résultat\
    \ d'une suppression dépendrait de la SOURCE de la ligne choisie, ce que l'interface ne peut pas\
    \ expliquer à l'utilisateur. Ce n'est pas théorique — le même changement a fait passer le corpus\
    \ PDF réel de imported 48, duplicates 1, reviewNeeded 0 à 49, 0, 1 (src/pdf-import.test.ts).\
    \ Un test : suppression refusée sur un groupe entièrement ENABLE_BANKING."
  - "ZÉRO DÉPENDANCE FRONTEND EN DEHORS DE REACT ET VITE. Décisions figées le 2026-08-03 pour que\
    \ Codex ne les tranche pas en codant, chacune étant l'endroit où une dépendance aurait pu\
    \ entrer. (1) AUCUN ROUTEUR — les deux ou trois vues tiennent dans un état, et la navigation\
    \ passe par le FRAGMENT d'URL avec un écouteur hashchange. Pas history.pushState : une URL\
    \ poussée entre en collision avec les routes d'API au rechargement (pousser /transactions rend\
    \ le JSON de la route d'API, pas l'application) et exige un repli SPA côté serveur qui avalerait\
    \ les vrais 404. Avec le fragment, le serveur ne voit jamais que / , il n'y a ni collision ni\
    \ repli à écrire, et le bouton retour du téléphone fonctionne nativement.\
    \ (2) AUCUNE BIBLIOTHÈQUE D'UI ni bibliothèque CSS — une seule feuille, police\
    \ système, et color-scheme: light dark en une ligne. AUCUNE POLICE EXTERNE : un lien vers un CDN\
    \ de polices casse le hors connexion sur PC éteint sans rien dire, ce qui est le mode de panne\
    \ que la Core Feature ne tolère pas. (3) LE SERVICE WORKER EST ÉCRIT À LA MAIN, une dizaine de\
    \ lignes, et il fait RÉSEAU D'ABORD, CACHE EN SECOURS — pas de vite-plugin-pwa, pas de Workbox,\
    \ pas de liste de pré-chargement, pas de numéro de version à incrémenter, pas de skipWaiting. En\
    \ ligne le navigateur reçoit toujours la version fraîche et le cache se remplit au passage ; PC\
    \ éteint, le cache répond. Le cache d'abord serait le piège inverse — il figerait l'application\
    \ sur une version ancienne sans jamais le dire, et il faudrait inventer une invalidation. Les\
    \ noms de fichiers hachés de Vite restent tels quels : l'index.html mis en cache référence les\
    \ fichiers mis en cache pendant la MÊME visite, donc l'ensemble est cohérent par construction.\
    \ (4) AUCUN manifest.json AU MVP — l'installation sur l'écran d'accueil n'est requise ni par le\
    \ hors connexion, qui tient au service worker, ni par la vérification du parcours, qui se fait à\
    \ l'URL. Ajout ultérieur d'une quinzaine de lignes si le confort quotidien le demande."
  - "L'APPARENCE N'EST PAS UN CRITÈRE D'ACCEPTATION DE T7 (Lamoms, 2026-08-03). Aucun verdict ne\
    \ peut être rouge pour une raison esthétique. Le but du MVP est de vérifier que le backend et le\
    \ frontend fonctionnent ensemble, sur PC et sur téléphone. Ce qui reste exigé est le\
    \ COMPORTEMENT — le parcours entier, connexion, solde et sa fraîcheur, les deux niveaux,\
    \ transactions, arbitrage d'un « à départager », puis PC éteint et dernier solde connu daté.\
    \ « Simple » qualifie le style, jamais les cas limites : une page austère qui tient tout le\
    \ parcours vaut mieux qu'une page soignée qui affiche un total. Seuls points non négociables\
    \ côté rendu, parce que ce sont des décisions et non du goût — locale FR, montants en euros,\
    \ dates JJ/MM."
  validations:
  - npm run typecheck
  - npm test
  - npm run build
  - Parcourir les cas limites un par un et vérifier qu'aucun ne mène à une page blanche.
  - "Vérifier que le rappel bancaire fonctionne toujours — GET /?code=…&state=… rend la page de rappel,\
    \ pas l'application."
  - "git diff src/server.ts ne touche pas la ligne du cookie de session (SameSite=Strict inchangé)."
  fichiers:
  - src/server.ts
  - package.json
  - web/ (à créer)
  - vite.config.ts (à créer)
  - src/ui-logic.ts (à créer)
  - src/ui-logic.test.ts (à créer)
  hors_perimetre:
  - Notifications, aucune au MVP.
  - Catégories, budgets, prévisions, graphiques.
  - Simulateur "et si je dépense X".
  - Ne pas toucher à src/deduplication.ts ni à la règle de pose de needs_review — elle appartient à T8.
  - Ne pas toucher à la condition de remise du marqueur ni à resolved_at — elles appartiennent à T10.
    T7 consomme la colonne, il ne la crée pas.
  - Aucun changement de schéma. Ni src/schema.ts ni src/db.ts ne bougent. Si un besoin de schéma
    apparaît, il est SIGNALÉ et devient sa propre tâche, il n'est pas ajouté au passage.
  - Ne pas toucher à src/enable-banking.ts, src/csv-import.ts ni src/pdf-import.ts.
  - Ne pas modifier la branche code+state du rappel bancaire dans GET / (src/server.ts:96-129).
  - Aucun runner de test frontend. node --test et les assertions existantes suffisent.
  - Aucune bibliothèque d'UI, aucune bibliothèque CSS, aucun routeur, aucune police externe, aucun
    manifest.json. La liste des dépendances frontend s'arrête à React et Vite.
  - Différenciation des layouts desktop et mobile — ultérieure, hors T7. Le MVP livre la MÊME
    interface sur les deux appareils.
  - Aucun travail esthétique. Thème, identité visuelle, animations, icônes — tout cela viendra après
    que le parcours soit prouvé de bout en bout.
T8:
  objectif: Rendre fiables les trois mécanismes déjà livrés qui donnent une fausse impression de marcher —
    la sauvegarde quotidienne, le certificat HTTPS local, et le rapprochement d'un candidat unique dans le
    moteur de déduplication. Chacun paraît fonctionner et se dégrade sans le dire.
  probleme_resolu: Dette laissée par des issues relues et validées, qu'on ne rouvre pas. Le critère 8 de
    T1 demandait une sauvegarde qui SE ROUVRE, preuve par lecture réelle ; seule la production du
    fichier a été livrée. S'y ajoutent trois échecs muets constatés le 2026-08-02 en relisant le code —
    une sauvegarde absente annoncée comme un succès, un certificat expiré jamais remplacé, et deux
    dépenses distinctes fusionnées en une. Aucun n'est urgent, tous faussent en silence.
  projets:
  - gestio
  dependances:
  - T1
  - T2
  parallelisable_avec:
  - T3
  - T4
  criteres_acceptation:
  - Un test crée une sauvegarde par scripts/backup.sh, la ROUVRE et y lit une donnée écrite avant.
    L'ouverture se fait avec better-sqlite3-multiple-ciphers, la bibliothèque du serveur, PAS avec le
    binaire sqlcipher qui a produit le fichier — c'est précisément l'entente entre les deux
    implémentations qui n'est pas prouvée aujourd'hui, et qui lâchera le jour de la restauration.
    L'existence du fichier ne vaut pas preuve (critère T1 déjà écrit, ligne 107).
  - L'en-tête du fichier de sauvegarde n'est pas « SQLite format 3 » — la copie est chiffrée.
  - Une sauvegarde qui n'a pas eu lieu sort avec un code non nul. Trois cas — GESTIO_DB_KEY absente
    (scripts/backup.sh:14-17, qui sort en 0 aujourd'hui), binaire sqlcipher introuvable, export en
    échec. Un cron muet sur un échec est pire que pas de sauvegarde, il donne une fausse assurance.
  - Le binaire sqlcipher manquant fait ÉCHOUER le test, il ne le fait pas passer en silence. Un test
    qui s'ignore lui-même quand l'outil manque ne prouve rien et se contente de rassurer.
  - Le certificat HTTPS local est régénéré quand il est EXPIRÉ, pas seulement quand il est absent.
    src/tls.ts:9 ne teste aujourd'hui que existsSync sur les deux fichiers. Le certificat est émis pour
    365 jours, donc vers le 2027-08-02 il expire, les fichiers restent en place, rien ne les remplace,
    et l'application devient injoignable jusqu'à suppression manuelle de .local/. Lire la fin de validité
    avant de réutiliser les fichiers.
  - Un test place un certificat DÉJÀ EXPIRÉ dans un répertoire temporaire et vérifie que
    localHttpsOptions() le remplace. Le cas de renouvellement est celui qu'on ne verra jamais venir
    autrement, puisqu'il ne se produit qu'une fois par an.
  - UN CANDIDAT UNIQUE NE SUFFIT PAS À FUSIONNER. Dans src/deduplication.ts, quand candidates.length vaut
    1, le rapprochement est fait sans jamais lire le libellé — le score de Jaccard est calculé puis jeté.
    Deux dépenses réellement distinctes, même jour et même montant, une par canal, libellés sans aucun
    rapport, fusionnent donc en silence, et le solde affiche un mouvement de moins EN AYANT L'AIR JUSTE.
    RÈGLE — quand les DEUX libellés sont présents et ne partagent AUCUN mot après normalisation, il n'y a
    pas de rapprochement, quel que soit le nombre de candidats. Un libellé absent d'un côté ne déclenche
    rien, on ne peut rien exiger de ce qui n'existe pas (Trade Republic, P25). Ce n'est pas un seuil de
    similarité — c'est le cas zéro, binaire.
  - Un test couvre ce cas — deux mouvements du même jour et du même montant, libellés « CARTE X0486
    RESTAURANT » d'un côté et « VIREMENT A MARIE » de l'autre, restent DEUX mouvements et sont marqués à
    départager.
  - NON-RÉGRESSION SUR LES DONNÉES RÉELLES — après le changement, le rejeu du lab rend toujours 27
    rapprochements, 0 orphelin et 0 à départager dans les DEUX ordres de canaux. Mesuré le 2026-08-02
    AVANT le changement — aucun des 27 rapprochements ne descend sous 0,5 de score, la nouvelle règle ne
    peut donc en casser aucun. Si un rapprochement disparaît, c'est le changement qui est faux, pas la
    mesure.
  - LA FAUTE EST DANS LE PLAN, PAS DANS LE CODE LIVRÉ. Le critère de T2 réservait Jaccard au départage
    entre plusieurs candidats et Codex l'a suivi à la lettre. L'issue 8 n'est ni rouverte ni blâmée ;
    seul son verdict reste acquis. À noter pour ne pas le redécouvrir — le défaut ne mord sur AUCUNE
    donnée réelle actuelle, c'est ce qui a permis de le différer ici plutôt que de le traiter à chaud.
  validations:
  - npm test
  - Lancer scripts/backup.sh sans GESTIO_DB_KEY et vérifier que le code de sortie n'est pas 0.
  - Rejeu réel — node_modules/.bin/tsx .lamoms/lab/agy/rejeu-t2.ts, code de sortie 0 attendu.
  fichiers:
  - scripts/backup.sh
  - src/tls.ts
  - src/deduplication.ts
  - src/deduplication.test.ts
  - src/backup.test.ts (à créer)
  - src/tls.test.ts (à créer)
  hors_perimetre:
  - Ne pas toucher au schéma de rotation sur 30 jours, ni à la planification cron.
  - Ne pas traiter la sauvegarde vers un support secondaire — c'est P37, après le MVP.
  - Ne pas modifier src/db.ts ni le chiffrement de la base ; T3 y travaille en parallèle.
  - Ne pas toucher à src/server.ts, à l'empreinte d'identité ni à normalizeTransactionLabel — l'empreinte
    des transactions déjà enregistrées ne doit pas bouger.
  - Aucun seuil de similarité chiffré, aucune règle liée au commerçant — hors périmètre de T2, inchangé.
  - PRÉREQUIS, PAS DU TRAVAIL DE T8 — la branche issue-8 doit être fusionnée dans master avant que T8
    commence, sans quoi src/deduplication.ts n'y existe pas. Constaté le 2026-08-02 — le commit de fusion
    d0028ba annonce « main (T2+T3) » alors que seul T3 y est ; git merge-base --is-ancestor répond NON
    pour le commit de l'issue 8. Fusion due de toute façon, elle n'a rien à voir avec cette tâche.
T9:
  objectif: >-
    Rendre démontrable ce qui n'est aujourd'hui que vrai — les critères de T2, T5 et T6 qui
    nomment des données réelles de référence sont tenus par le code, mais aucune preuve du dépôt ne les
    retient. Tâche de PREUVE, pas de correction — le code de production ne bouge pas.
  probleme_resolu: 'Audit des verdicts T2 → T6 du 2026-08-03 (.lamoms/audit-verdicts-T2-T6.md). Aucun
    faux VERT de la gravité de T1, mais un motif présent dans trois tâches sur cinq — un critère nomme
    une donnée réelle et ne dit pas quelle observation prouverait qu''on s''en est servi. Le projet
    connaissait déjà ce piège (P11 — le « 27/27 » du rapport de faisabilité comparait un jeu FABRIQUÉ),
    et il est ressorti. La faute est dans les critères, donc dans le plan, pas dans le code livré :
    Codex a suivi ce qui était écrit et Hermès a jugé sur ce qu''on lui montrait.'
  projets:
  - gestio
  dependances:
  - T2
  - T5
  - T6
  parallelisable_avec:
  - T7
  criteres_acceptation:
  - "UN TEST QUI EXIGE DES DONNÉES HORS DÉPÔT ÉCHOUE QUAND ELLES MANQUENT. Mesuré le 2026-08-03 —\
    \ `GESTIO_PDF_CORPUS=/nonexistent npm test` rend aujourd'hui `pass 11, fail 0, skipped 2` et sort\
    \ en SUCCÈS : src/pdf-import.test.ts:25 et :49 se désactivent seuls. Après la tâche, la même\
    \ commande sort en code NON NUL. Échappatoire unique, explicite et jamais par défaut :\
    \ GESTIO_SKIP_CORPUS=1. Un test qui s'ignore lui-même ne prouve rien et se contente de rassurer —\
    \ règle déjà posée par T8 pour le binaire sqlcipher, appliquée ici au corpus."
  - "LE REJEU DE RÉFÉRENCE DE T2 ENTRE DANS LE DÉPÔT. Le script existe (.lamoms/lab/agy/rejeu-t2.ts)\
    \ mais .gitignore:22 exclut .lamoms/lab/ — il n'est PAS versionné, il n'existe que sur cette\
    \ machine, et la validation de T8 en dépend. Le rejeu devient un test du dépôt qui lit les données\
    \ par chemin absolu hors dépôt et vérifie 27 rapprochements, 0 orphelin et 0 à départager dans les\
    \ DEUX ordres de canaux. Seul le SCRIPT entre au dépôt ; les données bancaires réelles restent\
    \ dehors et le restent."
  - "LE REGISTRE CSV EST PROUVÉ SUR LES FICHIERS RÉELS, pas sur du CSV écrit dans le test. Valeurs\
    \ mesurées le 2026-08-03 en passant les vrais fichiers dans parseBankCsv, à reprendre telles quelles\
    \ comme attendus. La Banque Postale, les deux CSV du lab — 19 et 8 mouvements, 0 ignoré, 0 caractère\
    \ de remplacement ; le décodage ISO-8859-1 est prouvé par le fait même que le préambule « Numéro\
    \ Compte » est reconnu, une lecture UTF-8 échouerait là. Revolut, le relevé de 254 lignes —\
    \ 250 mouvements, 3 ignorés (État = RENVOYÉ), 77 libellés accentués sans perte, et transactionAt =\
    \ 2025-09-27T13:05:08 avec transactionDate tronquée à la date ISO."
  - "LES TROIS COMPORTEMENTS TENUS PAR LE SEUL CODE REÇOIVENT CHACUN UN TEST. (a) La synchronisation\
    \ automatique de fond n'envoie NI psu-ip-address NI psu-user-agent — src/server.ts:56 passe {} et\
    \ seule la moitié inverse est testée (enable-banking.test.ts:156-157). (b) known_since n'est jamais\
    \ RECULÉ par une synchronisation plus courte — src/server.ts:775-779, la valeur n'est vérifiée\
