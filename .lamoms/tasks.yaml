    \ src/server.ts:721-746 écrit page par page dans une transaction SQLite, rien ne le retient."
  - "AUCUN DÉFAUT N'EST CORRIGÉ EN SILENCE. Si un test neuf révèle un vrai défaut du code de production,\
    \ il est SIGNALÉ et devient sa propre tâche — il n'est pas réparé au passage. Cette tâche démontre\
    \ l'existant ; un test qu'on ajuste jusqu'à ce qu'il passe ne prouve plus rien."
  validations:
