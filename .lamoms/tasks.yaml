T10:
  objectif: >-
    Faire survivre l'arbitrage de l'utilisateur à une resynchronisation. Aujourd'hui il tranche un
    « à départager » et la synchro suivante le lui reprend, sans trace.
  probleme_resolu: >-
    Tranché par Hermès le 2026-08-03 sur remontée de Claude (C1). needs_review est un booléen unique
    (src/db.ts:79) et ne sait pas distinguer « jamais examiné » de « l'utilisateur a décidé ». Or
    src/server.ts:742-744 exécute UPDATE transactions SET needs_review = 1 à chaque page de chaque
    synchronisation, sur la sortie d'une déduplication qui prend en entrée les transactions DÉJÀ
    STOCKÉES (src/server.ts:700 puis :716). L'utilisateur tranche, la synchro suivante retrouve la
    même ambiguïté, remet le marqueur à 1, et sa décision disparaît EN SILENCE. Le critère 5 de T7
    — « c'est lui qui tranche, avec son relevé » — est intenable sans cette tâche.
  projets:
  - gestio
  dependances:
  - T8
  parallelisable_avec:
  - T9
  criteres_acceptation:
  - "UNE COLONNE resolved_at SUR transactions, ajoutée par la même voie que les colonnes existantes\
    \ (addColumn dans src/db.ts, comme needs_review ligne 141). Type TEXT, nulle par défaut. Une base\
    \ existante se migre sans perte : les lignes déjà présentes ont resolved_at NULL, donc le\
    \ comportement d'avant est conservé tant que personne n'a rien tranché."
  - "LA RESYNCHRONISATION NE REMET PLUS LE MARQUEUR SUR UNE LIGNE RÉSOLUE. src/server.ts:744 devient\
    \ conditionnel — ... SET needs_review = 1 WHERE id = ? AND resolved_at IS NULL. C'est le seul\
    \ endroit qui pose le marqueur ; il n'y en a pas d'autre à traiter."
  - "PREUVE PAR REJEU, PAS PAR LECTURE. Un test : ingérer un groupe ambigu, vérifier needs_review = 1,\
    \ poser resolved_at, relancer la MÊME synchronisation, et vérifier que needs_review vaut toujours 0.\
    \ Sans le rejeu, le test ne prouve rien — c'est précisément la deuxième synchronisation qui casse\
    \ aujourd'hui, jamais la première."
  - "LA RÉSOLUTION PORTE SUR TOUT LE GROUPE, JAMAIS SUR UNE SEULE LIGNE. Un « à départager » concerne\
    \ au moins deux lignes. Si une seule reçoit resolved_at, les autres se font re-marquer à la synchro\
    \ suivante et le groupe réapparaît à moitié résolu. La pose de resolved_at sur un ensemble d'ids se\
    \ fait dans UNE SEULE transaction SQLite."
  - "AUCUN APPARIEMENT N'EST STOCKÉ, ET ON N'EN AJOUTE PAS. Rien en base ne dit quelle ligne est\
    \ ambiguë avec quelle autre. Le regroupement se reconstitue par la clé de déduplication elle-même,\
    \ (transaction_date, amount_cents), posée par le critère 1 de T2. C'est le consommateur qui\
    \ regroupe — pas de table d'appariement, pas de colonne de groupe."
  - "NON-RÉGRESSION SUR LE REJEU DE RÉFÉRENCE — après le changement, le rejeu du lab rend toujours\
    \ 27 rapprochements, 0 orphelin et 0 à départager dans les deux ordres de canaux. Aucune ligne du\
    \ lab n'ayant resolved_at, la nouvelle condition ne peut rien changer ; si le rejeu bouge, c'est le\
    \ changement qui est faux."
  validations:
  - npm run typecheck
  - npm test
  - Rejeu réel — node_modules/.bin/tsx .lamoms/lab/agy/rejeu-t2.ts, code de sortie 0 attendu.
  fichiers:
  - src/db.ts
  - src/schema.ts
  - src/server.ts
  - src/enable-banking.test.ts
  hors_perimetre:
  - Ne pas toucher à la règle de POSE de needs_review — elle appartient à T8, qui la fait évoluer en
    parallèle (cas zéro des libellés sans mot commun). T10 ne touche qu'à la CONDITION DE REMISE.
  - Aucune route d'API. Les points d'entrée d'arbitrage (POST /transactions/resolve,
    DELETE /transactions/:id) appartiennent à T7, qui consomme cette colonne.
  - Aucune interface. T10 rend l'arbitrage POSSIBLE, il ne l'expose pas.
  - Ne pas rouvrir le verdict de T8 ni celui de T2 — la faute est dans le plan, pas dans le code
    livré. T2 n'a jamais demandé que la décision de l'utilisateur soit retenue, personne n'y avait
    pensé avant l'écran de T7.
T11:
  objectif: >-
    Empêcher gestio d'écraser un certificat TLS qu'il n'a pas créé. Aujourd'hui il le remplace en
    silence par un auto-signé, et c'est le hors connexion du téléphone qui meurt sans cause visible.
  probleme_resolu: >-
    Constaté par Claude le 2026-08-03 en relisant le code livré par T8, avant le démarrage de T7.
    src/tls.ts:6-7 rend les chemins du certificat et de la clé configurables par
    GESTIO_TLS_CERT_FILE et GESTIO_TLS_KEY_FILE. src/tls.ts:10 régénère un auto-signé CN=localhost
    quand le fichier est absent OU — ajout de T8 — quand il est EXPIRÉ, et il écrit à ces chemins
    exacts. Or la remédiation prévue pour C2 consiste précisément à pointer ces variables vers le
    certificat émis par tailscale cert, seul moyen d'obtenir un contexte sécurisé sur le téléphone
    et donc d'enregistrer le service worker. Ces certificats durent 90 jours. Au premier
    dépassement, gestio écrase le vrai certificat par un auto-signé, le navigateur du téléphone
    refuse à nouveau le service worker, et rien dans les journaux ne relie la panne à sa cause. Le
    correctif de C2 se saborde donc lui-même à échéance. Ce n'est pas une régression de T8 — T8 a
    correctement traité l'expiration de l'auto-signé, personne n'avait encore décidé que ces chemins
    pourraient désigner un certificat appartenant à quelqu'un d'autre.
  projets:
  - gestio
  dependances: []
  parallelisable_avec:
  - T7
  - T9
  - T10
  criteres_acceptation:
  - "L'AUTO-GÉNÉRATION N'A LIEU QUE SUR LES CHEMINS PAR DÉFAUT. Si GESTIO_TLS_CERT_FILE ou\
    \ GESTIO_TLS_KEY_FILE est défini, gestio ne génère JAMAIS et n'écrit JAMAIS à ces chemins. Ne\
    \ jamais écraser un fichier qu'on n'a pas créé est la règle, la configuration explicite en est\
    \ la frontière."
  - "FICHIER CONFIGURÉ ABSENT OU EXPIRÉ — ERREUR EXPLICITE, JAMAIS UN ÉCRASEMENT. Le message nomme\
    \ le chemin concerné et, si le certificat existe et a expiré, la date d'expiration lue. Sans ces\
    \ deux éléments la panne ne ressemble à rien et se rediagnostique de zéro à chaque fois."
  - "LE COMPORTEMENT PAR DÉFAUT NE BOUGE PAS. Sans aucune variable d'environnement, l'auto-signé est\
    \ créé s'il manque et régénéré s'il a expiré, exactement comme T8 l'a livré. Le verdict de T8\
    \ n'est pas rouvert."
  - "PREUVE PAR LE FICHIER, PAS PAR LE MESSAGE. Un test pointe GESTIO_TLS_CERT_FILE vers un\
